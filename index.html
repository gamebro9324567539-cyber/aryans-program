<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0d1524" />
<title>Aryan's Program 2.0 | Career Analyzer</title>
<style>
:root{--bg:#0b1024;--panel:rgba(255,255,255,.085);--line:rgba(255,255,255,.14);--text:#f7f8ff;--muted:#b9c0dc;--pink:#ff6bd6;--blue:#72e5ff;--gold:#ffd166;--green:#8ff0c2}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 10% 0%,#38206d 0,transparent 34%),radial-gradient(ellipse at 90% 12%,#123e65 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff40 1px,transparent 1px);background-size:42px 42px;opacity:.18;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1120px,92%);margin:auto;position:relative;z-index:1}
.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),#8e7bff 55%,var(--blue));box-shadow:0 8px 30px #a34cff40;font-size:21px}
.nav-tag{color:var(--muted);font-size:.88rem;border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#ffffff08}
.hero{padding:55px 0 36px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:34px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;color:#e5caff;background:#a15dff18;border:1px solid #c084fc55;padding:8px 13px;border-radius:999px;font-size:.84rem;font-weight:700}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #8ff0c222}
h1{font-size:clamp(2.5rem,6vw,5rem);line-height:1.02;letter-spacing:-.055em;margin:20px 0}
.gradient-text{background:linear-gradient(95deg,#fff 10%,var(--pink) 45%,var(--blue) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:1.1rem;line-height:1.75;max-width:620px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;transition:transform .2s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-primary{background:linear-gradient(110deg,var(--pink),#a88bff 55%,var(--blue));color:#11152e;box-shadow:0 12px 32px #8c6dff30}

.hero-card{position:relative;border:1px solid var(--line);border-radius:30px;padding:27px;background:linear-gradient(145deg,#ffffff16,#ffffff04);box-shadow:0 30px 90px #0004;overflow:hidden;animation:float 6s ease-in-out infinite}
.hero-card:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#9d76ff30;filter:blur(28px);right:-80px;top:-90px}
.orb{width:138px;height:138px;margin:12px auto 22px;border-radius:42px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#ff6bd64d,#72e5ff35);border:1px solid #ffffff28;transform:rotate(-8deg);box-shadow:inset 0 0 35px #ffffff10,0 18px 45px #0003}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stat strong{display:block;font-size:1.25rem}.stat span{color:var(--muted);font-size:.75rem}
.section{padding:35px 0 60px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}

.section-head p,.muted{color:var(--muted);line-height:1.6;margin:0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feature{padding:22px;border-radius:22px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);transition:transform .25s,border-color .25s}
.feature:hover{transform:translateY(-5px);border-color:#d7a4ff80}
.feature-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#ff6bd62b,#72e5ff22);font-size:24px;margin-bottom:16px}
.feature h3{margin:0 0 8px}.feature p{color:var(--muted);line-height:1.65;margin:0}
.panel{background:linear-gradient(145deg,#ffffff12,#ffffff06);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,30px);box-shadow:0 18px 60px #0002}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-weight:750;font-size:.94rem}
.field small{color:var(--muted);font-size:.8rem}
input,select,textarea{width:100%;background:#090e24;color:var(--text);border:1px solid #ffffff28;border-radius:12px;padding:12px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #72e5ff1b}
option{background:#11152e}
.progress-wrap{height:8px;background:#ffffff14;border-radius:99px;overflow:hidden;margin:18px 0 24px}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--pink),#9e89ff,var(--blue));transition:width .3s}
.form-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.result{display:none;margin-top:22px}
.result.show{display:block;animation:rise .45s ease}
.result-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.score-ring{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--score,70%),#ffffff17 0);position:relative;flex-shrink:0}
.score-ring:before{content:"";position:absolute;inset:8px;background:#11152e;border-radius:50%}
.score-ring strong{position:relative;font-size:1.4rem}
.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.result-box{padding:17px;border-radius:17px;background:#080d20a8;border:1px solid var(--line)}
.result-box h4{margin:0 0 8px}.result-box p,.result-box li{color:var(--muted);line-height:1.6}
.result-box ul{padding-left:19px;margin-bottom:0}
.quiz-question{padding:17px;border-radius:16px;border:1px solid var(--line);background:#090e24;margin:14px 0}
.quiz-question h4{margin:0 0 12px}
.choice{display:flex;align-items:flex-start;gap:9px;padding:8px 0;color:var(--muted);cursor:pointer}
.choice input{width:auto;margin-top:4px;accent-color:#ff6bd6}
.quiz-result{margin-top:16px;padding:16px;border-radius:15px;background:#8ff0c215;border:1px solid #8ff0c244;display:none}
.rating{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.star{font-size:1.8rem;color:#64708e;background:none;border:0;padding:2px;transition:transform .2s}
.star.active,.star:hover{color:var(--gold);transform:scale(1.12)}
.story-box{display:none;margin-top:16px}.story-box.show{display:block}.story-content{white-space:pre-wrap;line-height:1.85;color:var(--muted);font-size:1rem}
.footer{padding:28px 0 38px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#f7f8ff;color:#10152d;padding:12px 18px;border-radius:12px;font-weight:750;box-shadow:0 12px 40px #0005;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#050816d9;backdrop-filter:blur(12px);display:grid;place-items:center;padding:20px;z-index:20}
.modal-card{width:min(440px,100%);border-radius:26px;border:1px solid var(--line);background:linear-gradient(145deg,#1b2145,#0d1229);padding:28px;box-shadow:0 25px 90px #0008}
.modal-card h2{margin-top:14px}
.hidden{display:none!important}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:32px}.hero-card{max-width:520px}.cards{grid-template-columns:1fr}.form-grid,.result-grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.nav-tag{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

.hub-intro{max-width:760px}.hub-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.hub-card{display:flex;flex-direction:column;align-items:flex-start;min-height:190px}.hub-card .feature-icon{flex-shrink:0}.hub-card p{flex:1;margin-bottom:16px}.hub-card .btn{margin-top:auto}.hub-panel{margin-top:22px;display:none}.hub-panel.show{display:block;animation:rise .35s ease}.hub-panel h3{margin-top:0}.hub-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hub-output{white-space:pre-wrap;overflow-wrap:anywhere;background:#070b1b;border:1px solid var(--line);border-radius:14px;padding:15px;min-height:52px;color:#c8f7e4;margin-top:12px}.hub-list{display:grid;gap:10px}.hub-item{padding:13px;border-radius:14px;background:#080d20a8;border:1px solid var(--line)}.hub-item label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.hub-item input[type=checkbox],.hub-item input[type=radio]{width:auto;margin-top:4px;accent-color:var(--pink)}.hub-item small{display:block;color:var(--muted);margin-top:4px}.hub-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hub-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.hub-stat{padding:17px;border-radius:16px;background:#080d20a8;border:1px solid var(--line)}.hub-stat strong{display:block;font-size:1.8rem}.hub-stat span{color:var(--muted);font-size:.85rem}.hub-progress{height:9px;border-radius:99px;background:#ffffff17;overflow:hidden;margin-top:9px}.hub-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),#9e89ff,var(--blue));width:0}.hub-code{min-height:170px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.55}.hub-mini-arena{position:relative;min-height:270px;border:1px dashed #ffffff40;border-radius:20px;background:radial-gradient(circle at center,#243264,#090e24 70%);overflow:hidden;margin-top:14px}.hub-target{position:absolute;border:0;border-radius:50%;width:58px;height:58px;background:linear-gradient(135deg,var(--pink),var(--blue));box-shadow:0 0 28px #72e5ff80;font-size:25px;display:none;touch-action:manipulation}.hub-meter{height:10px;background:#ffffff18;border-radius:99px;overflow:hidden}.hub-meter span{display:block;height:100%;background:linear-gradient(90deg,#ff6bd6,#ffd166,#8ff0c2);width:0}.hub-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;margin:4px;border:1px solid var(--line);border-radius:13px;background:#ffffff09}.hub-badge.locked{opacity:.42;filter:grayscale(1)}.hub-note{color:var(--muted);font-size:.88rem;line-height:1.6}.password-meter{margin-top:8px;display:none}.password-meter.show{display:block}.password-meter .hub-meter{margin-top:7px}.theme-light{--bg:#eef2ff;--panel:rgba(255,255,255,.82);--line:rgba(31,41,80,.18);--text:#18213c;--muted:#52607f}.theme-light input,.theme-light select,.theme-light textarea{background:#fff;color:#18213c}.theme-light .hub-output,.theme-light .hub-item,.theme-light .hub-stat{background:#fff;color:#18213c}.theme-neon{--pink:#ff2bd6;--blue:#00f5ff;--green:#80ff00;--gold:#fff000;--line:rgba(0,245,255,.32)}body.no-animations *,body.no-animations *:before,body.no-animations *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(max-width:800px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-two,.hub-three{grid-template-columns:1fr}}

/* PROGRAM 1 INTERACTIVE REDESIGN — app screens, not one long scrolling page */
:root{--bg:#0d1524;--panel:rgba(24,39,59,.88);--line:rgba(170,198,220,.17);--text:#edf7ff;--muted:#9eb1c7;--pink:#ffb86b;--blue:#67e8d5;--gold:#ffd166;--green:#8ce6ad}
body{background:radial-gradient(ellipse at 8% 0%,#173d4b 0,transparent 36%),radial-gradient(ellipse at 94% 8%,#30305a 0,transparent 33%),#0d1524;}
body:before{background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:34px 34px;opacity:.48;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.nav{padding:16px 0 12px}.logo{border-radius:13px;background:linear-gradient(135deg,#67e8d5,#82aaff 55%,#ffb86b);box-shadow:0 8px 28px #67e8d526;color:#10202a}.brand{font-size:1.04rem}
.app-nav{display:flex;gap:8px;overflow-x:auto;padding:8px;margin:4px auto 0;border:1px solid var(--line);border-radius:19px;background:#101e2de8;position:sticky;top:8px;z-index:15;backdrop-filter:blur(18px);scrollbar-width:thin}
.app-nav-btn{flex:1 0 auto;min-width:88px;border:1px solid transparent;border-radius:13px;padding:11px 14px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,color .2s,border-color .2s}
.app-nav-btn span{font-size:1.05rem}.app-nav-btn b{font-size:.84rem;white-space:nowrap}.app-nav-btn:hover{background:#ffffff0b;color:var(--text)}.app-nav-btn.active{background:linear-gradient(120deg,#67e8d51f,#82aaff22);color:#e9fffb;border-color:#67e8d54a;box-shadow:inset 0 0 0 1px #67e8d508}
.screen-caption{display:flex;align-items:center;gap:10px;padding:18px 0 2px;color:var(--muted);font-size:.83rem}.screen-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px #67e8d51a}.caption-line{height:1px;background:var(--line);flex:1}.caption-chip{border:1px solid var(--line);background:#ffffff06;border-radius:999px;padding:6px 9px;font-size:.68rem;letter-spacing:.08em;white-space:nowrap;color:#b7c9d9}
.app-main{min-height:62vh}.app-main>section{animation:screenIn .3s ease both}.app-main>section.screen-hidden{display:none!important}.app-main>section.screen-visible{display:block}.app-main>section#home.screen-visible{display:grid}.app-main>section#features.screen-visible{display:block}
.hero{padding:34px 0 22px;gap:28px}.hero-card{border-radius:25px;background:linear-gradient(145deg,#1a2b3c,#132133);border-color:#a8c8df24}.orb{background:linear-gradient(135deg,#67e8d532,#82aaff25);border-color:#a9e8e130}.eyebrow{color:#b9fff4;background:#67e8d512;border-color:#67e8d53b}.gradient-text{background:linear-gradient(95deg,#fff 5%,#67e8d5 48%,#ffbf7b 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{border-radius:12px}.btn-primary{background:linear-gradient(115deg,#67e8d5,#9de6c5);color:#10212b;box-shadow:0 9px 25px #67e8d51a}.btn-secondary{background:#ffffff08;border-color:#a8c8df2b}.feature,.panel{background:linear-gradient(145deg,#18283a,#122033);border-color:#a8c8df20;box-shadow:0 16px 42px #02081228}.feature{border-radius:20px}.feature:hover{border-color:#67e8d57a;transform:translateY(-3px)}.feature-icon{background:linear-gradient(135deg,#67e8d51c,#ffbf7b16);border:1px solid #a8c8df12}.section{padding:24px 0 34px}.section-head{margin-bottom:18px}.panel{border-radius:23px}input,select,textarea,.quiz-question{background:#0c1727;border-color:#a8c8df2c}option{background:#0c1727}.stat,.hub-stat,.result-box,.hub-item{background:#0b1726d9;border-color:#a8c8df20}.score-ring:before{background:#132033}.hub-grid{gap:13px}.hub-card{min-height:175px}.hub-card .btn{width:100%}.hub-output{background:#091321;border-color:#a8c8df22}
/* Feature cards open a full-screen workspace with a back control, never a panel far below. */
#hubPanel.hub-panel{display:none;position:fixed;inset:0;z-index:40;overflow:auto;margin:0;padding:clamp(18px,4vw,44px);border-radius:0;border:0;background:radial-gradient(ellipse at 12% 0%,#173d4b 0,transparent 38%),#0d1524;box-shadow:none;backdrop-filter:blur(18px)}
#hubPanel.hub-panel.show{display:block;animation:slideIn .28s ease both}body.feature-open{overflow:hidden}.hub-slide-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1040px;margin:0 auto 30px}.hub-panel>.section-head,.hub-panel>div:not(.hub-slide-top){max-width:1040px;margin-left:auto;margin-right:auto}.hub-panel>.section-head{margin-bottom:20px}.hub-panel .section-head h3{font-size:clamp(1.5rem,4vw,2.2rem)}
.footer{margin-top:24px}.modal-card{background:linear-gradient(145deg,#1b3041,#101c2c);border-color:#9cbdd52b}.modal-card .logo{margin-bottom:4px}
@keyframes screenIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:800px){.app-nav{top:4px}.app-nav-btn{min-width:76px;padding:10px 11px;flex-direction:column;gap:4px}.app-nav-btn b{font-size:.72rem}.hero{grid-template-columns:1fr;padding-top:25px}.hero-card{max-width:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hub-two,.hub-three{grid-template-columns:repeat(2,minmax(0,1fr))}.screen-caption{font-size:.77rem}.caption-chip{font-size:.58rem}}
@media(max-width:430px){.brand{font-size:.92rem}.nav{padding-top:12px}.app-nav{gap:5px;padding:6px;border-radius:15px}.app-nav-btn{min-width:65px;padding:9px 7px}.app-nav-btn span{font-size:1rem}.app-nav-btn b{font-size:.65rem}.caption-chip{display:none}.cards{grid-template-columns:1fr}.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.hub-card{padding:13px}.hub-card h3{font-size:.93rem}.hub-card p{font-size:.8rem}.hub-card .btn{font-size:.78rem;padding:10px 6px}.hub-two,.hub-three,.form-grid,.result-grid{grid-template-columns:1fr}.hub-slide-top{align-items:flex-start;flex-direction:column}#hubPanel.hub-panel{padding:17px}}
@media(prefers-reduced-motion:reduce){.app-main>section,.hub-panel.hub-panel.show{animation:none!important}}


/* FINAL MOBILE NAVIGATION + WORKSPACE OVERLAP FIX */
.app-nav{
  position:relative!important; top:auto!important; z-index:5!important;
  overflow:visible!important; flex-wrap:wrap!important; justify-content:stretch;
  scroll-snap-type:none!important; margin-bottom:10px;
}
.app-nav-btn{flex:1 1 130px!important; min-width:0!important}

/* A feature workspace must cover the app, including the navigation, and scroll independently. */
#hubPanel.hub-panel{position:fixed!important;inset:0!important;z-index:9999!important;width:100%!important;height:100%!important;height:100dvh!important
